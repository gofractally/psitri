name: Website and benchmark tooling

on:
  push:
    branches: [main, sal2]
    paths:
      - "website/**"
      - "docs/api/**"
      - "examples/api/**"
      - "scripts/build_site.py"
      - "scripts/benchmark_charts.py"
      - "scripts/benchmark.py"
      - "scripts/fair_bank.py"
      - "scripts/benchmark_idle.py"
      - "scripts/api_bank_matrix.py"
      - "scripts/api_bank_evidence.py"
      - "benchmarks/fair_bank/**"
      - "benchmarks/api_bank/**"
      - "tests/website/**"
      - "logs/2026-06-17_gcart_spec-bank-vs-mdbx/**"
      - "logs/2026-06-13_delta_art-1B/**"
      - "libraries/start_ref/STATUS.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/api/**"
      - "scripts/**"
      - "benchmarks/fair_bank/**"
      - "benchmarks/api_bank/**"
      - "tests/website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: python -m pip install -r website/requirements.txt
      - name: Test benchmark capture and regression detection
        run: python -m unittest discover -s tests/website -v
      - name: Build and validate public artifact
        run: python scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
